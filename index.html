 <!DOCTYPE html>

<html>


<head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>

        body {

            margin: 0;

            overflow: hidden;

        }

        #tap-guide {

            position: absolute;

            top: 20px;

            left: 50%;

            transform: translateX(-50%);

            background: rgba(0, 0, 0, 0.7);

            color: #fff;

            padding: 8px 16px;

            border-radius: 20px;

            font-size: 14px;

            z-index: 999;

        }

    </style>

</head>


<body>

    <div id="tap-guide">画面を1回タップしてください</div>


    <a-scene

        mindar-image="imageTargetSrc: ./targets.mind;"

        color-space="sRGB"

        renderer="colorManagement: true, physicallyCorrectLights"

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false">


        <a-assets>

            <img id="bubble-img" src="./hato.png" />

        </a-assets>


        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>


        <a-entity mindar-image-target="targetIndex: 0">

            <!-- 中央（マーカー画像の上）に重なる動画 -->

            


            <!-- 

                ★位置を右側に変更:

                position="X Y Z"

                ・X = 0.8（マーカー右端よりさらに右側）

                ・Y = 0（上下中央） ※少し上にしたい場合は 0.2 など

                ・Z = 0.1（画面から少し手前に浮かせる）

            -->

            <a-plane

                src="#bubble-img"

                transparent="true"

                width="1.0" height="0.5"

                position="0.5 0 0.5"

                material="shader: flat">

            </a-plane>

        </a-entity>

    </a-scene>


    <script>

        window.addEventListener('click', () => {

            const v = document.getElementById('spot-video');

            if (v) {

                v.play();

            }

            const guide = document.getElementById('tap-guide');

            if (guide) guide.style.display = 'none';

        });

    </script>

</body>


</html> <!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #tap-guide {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 999;
        }
        #dynamic-canvas {
            display: none;
        }
    </style>
</head>

<body>
    <div id="tap-guide">画面を1回タップしてください</div>

    <canvas id="dynamic-canvas" width="512" height="256"></canvas>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <canvas id="airplane-canvas" width="512" height="256"></canvas>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 
            ★修正点: マーカー認識の親要素側にアニメーションを持たせる
        -->
        <a-entity 
            mindar-image-target="targetIndex: 0" 
            id="ar-target"
            animation="property: position; from: 0 0 -0.5; to: 0 0.6 1.2; dur: 2000; easing: easeOutQuad; startEvents: targetFound;"
            animation__scale="property: scale; from: 0.2 0.2 0.2; to: 1.2 1.2 1.2; dur: 2000; easing: easeOutQuad; startEvents: targetFound;">
            
            <!-- 中身の plane はシンプルに配置する -->
            <a-plane
                src="#airplane-canvas"
                transparent="true"
                width="1.2" height="0.6"
                position="0 0 0">
            </a-plane>

        </a-entity>
    </a-scene>

    <script>
        // Canvasに飛行機を描画
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('airplane-canvas');
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 本体
            ctx.fillStyle = '#007aff';
            ctx.beginPath();
            ctx.moveTo(100, 128);
            ctx.lineTo(400, 90);
            ctx.lineTo(450, 128);
            ctx.lineTo(400, 166);
            ctx.closePath();
            ctx.fill();

            // 翼（上）
            ctx.fillStyle = '#5ac8fa';
            ctx.beginPath();
            ctx.moveTo(250, 128);
            ctx.lineTo(200, 50);
            ctx.lineTo(280, 110);
            ctx.fill();

            // 翼（下）
            ctx.beginPath();
            ctx.moveTo(250, 128);
            ctx.lineTo(200, 206);
            ctx.lineTo(280, 146);
            ctx.fill();

            // 文字
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('✈ JAPAN AIR', 135, 138);
        });

        window.addEventListener('click', () => {
            const guide = document.getElementById('tap-guide');
            if (guide) guide.style.display = 'none';
        });
    </script>
</body>

</html>
