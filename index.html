<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<!-- A-Scene (MindAR ターゲット認識) -->
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			<!-- 読み込む動画ファイル（同じ階層に test.mp4 を配置してください） -->
			<video id="test-video" src="./test.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- マーカー認識時に動画を表示するエンティティ -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			<!-- width / height で動画の縦横比を調整できます -->
			<a-video src="#test-video" position="0 0 0" width="1" height="0.5625" rotation="0 0 0"></a-video>
		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const videoElement = document.querySelector("#test-video");

			// マーカーを検出したら動画を再生
			targetEntity.addEventListener("targetFound", () => {
				videoElement.play().catch(e => {
					console.log("Autoplay prevented:", e);
				});
			});

			// マーカーを見失ったら動画を一時停止・巻き戻し
			targetEntity.addEventListener("targetLost", () => {
				videoElement.pause();
				videoElement.currentTime = 0;
			});
		});
	</script>
</body>

</html>
