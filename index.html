<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: transparent;
		}

		/* 全画面演出ステージ */
		.ar-stage {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			z-index: 10;
			display: none;
			overflow: hidden;
		}

		.ar-stage.active {
			display: block;
		}

		svg {
			width: 100%;
			height: 100%;
		}

		/* 巨大な飛行機と軌跡（白シルエット） */
		.flight-path {
			fill: none;
			stroke: #ffffff;
			stroke-width: 5px;
			stroke-linecap: round;
			stroke-dasharray: 2500;
			stroke-dashoffset: 2500;
			opacity: 0;
		}

		.plane-group {
			opacity: 0;
			/* パスに沿って進行方向を向く設定 */
			offset-rotate: auto;
		}

		.is-animating .flight-path {
			animation: drawPath 3.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		.is-animating .plane-group {
			animation: flyPlane 3.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		.white-silhouette {
			fill: #ffffff;
			filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.3));
		}

		/* 観光地や食べ物のシルエットが流れるアニメーション */
		.silhouette-item {
			position: absolute;
			bottom: 20vh;
			left: -300px;
			fill: #ffffff;
			filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.3));
			opacity: 0;
			width: 180px;
			height: 180px;
			animation: panSilhouette 3.5s linear forwards;
		}

		@keyframes flyPlane {
			0% { offset-distance: 0%; opacity: 0; transform: scale(2.0); }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { offset-distance: 100%; opacity: 0; transform: scale(2.0); }
		}

		@keyframes drawPath {
			0% { stroke-dashoffset: 2500; opacity: 0; }
			15% { opacity: 0.9; }
			85% { opacity: 0.9; }
			100% { stroke-dashoffset: 0; opacity: 0; }
		}

		@keyframes panSilhouette {
			0% {
				left: -250px;
				opacity: 0;
				transform: scale(0.9);
			}
			15% {
				opacity: 1;
				transform: scale(1.1);
			}
			85% {
				opacity: 1;
				transform: scale(1.1);
			}
			100% {
				left: 105vw;
				opacity: 0;
				transform: scale(1.2);
			}
		}
	</style>
</head>

<body>
	<!-- A-Scene (MindAR ターゲット認識) -->
	<a-scene
		mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
	</a-scene>

	<!-- 白シルエットのAR演出ステージ -->
	<div id="ar-stage" class="ar-stage">
		<svg viewBox="0 0 1080 1920" preserveAspectRatio="none">
			<path id="flight-trail" class="flight-path" d="" pathLength="2500" />
			<g id="flight-plane" class="plane-group">
				<g transform="scale(6.0) translate(-12, -21)">
					<path class="white-silhouette" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
				</g>
			</g>
		</svg>

		<!-- 観光地や食べ物のシルエットが流れるコンテナ -->
		<div id="silhouette-layer" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;"></div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const arStage = document.getElementById("ar-stage");
			const flightTrail = document.getElementById("flight-trail");
			const flightPlane = document.getElementById("flight-plane");
			const silhouetteLayer = document.getElementById("silhouette-layer");

			let isTracking = false;
			let sequenceInterval = null;

			// 画面をダイナミックに横切る飛行ルート（回転方向を指定）
			const routes = [
				{ path: "M -100,1400 Q 540,600 1180,400", rotate: "auto 90deg" },
				{ path: "M -100,500 Q 540,1300 1180,1400", rotate: "auto 90deg" }
			];

			// 世界の観光地・食べ物の白シルエットSVG集
			const silhouetteSvgs = [
				// 1. エッフェル塔
				`<svg viewBox="0 0 24 24"><path d="M11 2h2l2 6h-6l2-6zm-1 7h4l1 6h-6l1-6zm-2 7h8l1 6h-10l1-6z"/></svg>`,
				// 2. 富士山
				`<svg viewBox="0 0 24 24"><path d="M2 22l10-16 10 16H2zm10-12l-4 7h8l-4-7z"/></svg>`,
				// 3. 東京タワー
				`<svg viewBox="0 0 24 24"><path d="M11 2h2v3h-2V2zm-1 4h4l1.5 14h-7l1.5-14zm1 3h2v4h-2V9zm0 5h2v5h-2v-5z"/></svg>`,
				// 4. ピザの斜塔
				`<svg viewBox="0 0 24 24"><path d="M9 3l3-1 2 20h-4L9 3zm-1 5h6v2H8V8zm1 5h4v2H9v-2zm-1 5h6v2H8v-2z" transform="skewX(-8)"/></svg>`,
				// 5. グルメ（ピザ・フードのイメージシルエット）
				`<svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4l6.5 13h-13L12 6z"/></svg>`
			];

			function spawnSilhouette() {
				if (!isTracking) return;
				const wrapper = document.createElement("div");
				wrapper.className = "silhouette-item";
				
				const svgContent = silhouetteSvgs[Math.floor(Math.random() * silhouetteSvgs.length)];
				wrapper.innerHTML = svgContent;

				const randomBottom = Math.floor(Math.random() * 25) + 15;
				wrapper.style.bottom = `${randomBottom}vh`;
				wrapper.style.animationDuration = `${Math.random() * 1.0 + 3.2}s`;

				silhouetteLayer.appendChild(wrapper);
				setTimeout(() => wrapper.remove(), 4000);
			}

			function triggerSequence() {
				if (!isTracking) return;

				const route = routes[Math.floor(Math.random() * routes.length)];
				flightTrail.setAttribute("d", route.path);
				
				// パスと進行方向（角度）を適用
				flightPlane.style.offsetPath = `path("${route.path}")`;
				flightPlane.style.offsetRotate = route.rotate;

				arStage.classList.remove("is-animating");
				void arStage.offsetWidth;
				arStage.classList.add("is-animating");

				// 飛行機の通過後に、観光地や食べ物のシルエットを連続して流す
				setTimeout(() => {
					for (let i = 0; i < 3; i++) {
						setTimeout(spawnSilhouette, i * 750);
					}
				}, 600);
			}

			targetEntity.addEventListener("targetFound", () => {
				isTracking = true;
				arStage.classList.add("active");
				triggerSequence();

				if (!sequenceInterval) {
					sequenceInterval = setInterval(triggerSequence, 4500);
				}
			});

			targetEntity.addEventListener("targetLost", () => {
				isTracking = false;
				arStage.classList.remove("active");
				arStage.classList.remove("is-animating");
				silhouetteLayer.innerHTML = "";

				if (sequenceInterval) {
					clearInterval(sequenceInterval);
					sequenceInterval = null;
				}
			});
		});
	</script>
</body>

</html>
